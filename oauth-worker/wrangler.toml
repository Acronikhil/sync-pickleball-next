name = "sync-pickleball-oauth"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Google OAuth 2.0 Web client id. Public by design — must match
# NEXT_PUBLIC_GOOGLE_CLIENT_ID exactly, since it's checked as the token's
# audience.
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID"

# Only these origins may call /publish. Comma-separated, no trailing slash.
# Add the production domain here too when this site takes over from www. Drop
# localhost once you no longer run the admin panel locally.
ALLOWED_ORIGINS = "https://cms.syncpickleball.com,http://localhost:3000"

# Google accounts allowed to publish, comma-separated, case-insensitive. This
# is the real access-control check — enforced here, server-side, not just in
# the browser.
ADMIN_EMAILS = "REPLACE_WITH_YOUR_GMAIL_ADDRESS"

# Repo the Worker commits to on the caller's behalf.
REPO_OWNER = "Acronikhil"
REPO_NAME = "sync-pickleball-next"
REPO_BRANCH = "main"
CONTENT_PATH = "content/site.json"

# GITHUB_TOKEN is NOT set here — it is a secret:
#   npx wrangler secret put GITHUB_TOKEN
#
# Use a fine-grained personal access token
# (https://github.com/settings/personal-access-tokens/new) scoped to ONLY this
# repository, with "Contents: Read and write" permission. Never use a classic
# token here — it can't be scoped to one repo.
