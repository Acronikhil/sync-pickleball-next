name: Deploy site

on:
  push:
    branches: [main]
    # Docs-only edits don't change the built site.
    paths-ignore:
      - "docs/**"
      - "oauth-worker/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A publish from the admin panel while a build is already running should
# supersede it rather than queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          # Repository variables (Settings -> Secrets and variables -> Actions
          # -> Variables). None of these are secret: they are baked into the
          # client bundle by design. The OAuth client *secret* lives only in
          # the Cloudflare Worker.
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_OAUTH_PROXY_URL: ${{ vars.OAUTH_PROXY_URL }}
          NEXT_PUBLIC_REPO_OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_BRANCH: main
          NEXT_PUBLIC_ADMIN_USERS: ${{ vars.ADMIN_USERS }}
          # Canonical URL, and whether search engines may index this site. Both
          # stay pointed at the subdomain until it replaces www — see README.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://cms.syncpickleball.com' }}
          NEXT_PUBLIC_ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
